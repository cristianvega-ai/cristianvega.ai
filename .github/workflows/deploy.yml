# Verify every change, and deploy main to production through the receiver.
#
# Verify runs on every pull request and on every push to main. It has no
# secrets. It builds the site, runs the complete gate, and packs dist/ into
# one archive. Deploy production runs only for the current commit on main,
# only when the PRODUCTION_DEPLOY_ENABLED variable is "true", and only through
# the restricted SSH key held by the production environment. That key can run
# nothing on the host but the receiver, which accepts static files only.
#
# Every action is pinned to a full commit SHA. Dependabot proposes updates.
# README.md and scripts/deploy-receiver.py describe the whole path.

name: Verify and deploy

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    outputs:
      package_sha256: ${{ steps.package.outputs.package_sha256 }}
      receiver_sha256: ${{ steps.package.outputs.receiver_sha256 }}

    steps:
      - name: Check out the commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.15.0

      - name: Install locked dependencies
        run: npm ci

      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: Verify package signatures
        run: npm audit signatures

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run the complete gate
        run: npm run verify

      - name: Package the site
        id: package
        shell: bash
        run: |
          set -euo pipefail

          for name in .htaccess index.html 404.html robots.txt sitemap-index.xml; do
            if [[ ! -f "dist/$name" ]]; then
              echo "dist/$name is missing" >&2
              exit 1
            fi
          done

          unexpected="$(find dist ! -type d ! -type f -print -quit)"
          if [[ -n "$unexpected" ]]; then
            echo "dist/ holds an object that is not a file or a directory: $unexpected" >&2
            exit 1
          fi

          package_dir="${RUNNER_TEMP}/deploy-package"
          install -d -m 0700 "$package_dir"

          tar \
            --create \
            --gzip \
            --format=ustar \
            --owner=0 \
            --group=0 \
            --numeric-owner \
            --file "$package_dir/site.tar.gz" \
            --directory dist \
            .

          cp scripts/verify-deploy.mjs "$package_dir/verify-deploy.mjs"
          (
            cd "$package_dir"
            sha256sum site.tar.gz verify-deploy.mjs > SHA256SUMS
          )

          package_sha256="$(sha256sum "$package_dir/site.tar.gz" | awk '{ print $1 }')"
          receiver_sha256="$(sha256sum scripts/deploy-receiver.py | awk '{ print $1 }')"
          echo "package_sha256=$package_sha256" >> "$GITHUB_OUTPUT"
          echo "receiver_sha256=$receiver_sha256" >> "$GITHUB_OUTPUT"
          echo "package sha256:  $package_sha256"
          echo "receiver sha256: $receiver_sha256"

      - name: Store the verified package
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: production-site-${{ github.sha }}
          path: ${{ runner.temp }}/deploy-package
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  deploy:
    name: Deploy production
    needs: verify
    if: >-
      needs.verify.result == 'success' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      github.ref == 'refs/heads/main' &&
      github.repository == 'cristianvega-ai/cristianvega.ai' &&
      vars.PRODUCTION_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    environment:
      name: production
      url: https://cristianvega.ai

    concurrency:
      group: cristianvega-ai-production
      cancel-in-progress: false

    steps:
      - name: Confirm this is the current main commit
        id: current
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          current_sha="$(
            git ls-remote \
              https://github.com/cristianvega-ai/cristianvega.ai.git \
              refs/heads/main |
            awk 'NR == 1 { print $1 }'
          )"

          if [[ ! "$current_sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "GitHub did not return a valid main commit." >&2
            exit 1
          fi

          if [[ "$current_sha" == "$EXPECTED_SHA" ]]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            echo "A newer main commit exists. This run will not deploy; the newer run will."
          fi

      - name: Download the verified package
        if: steps.current.outputs.deploy == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: production-site-${{ github.sha }}
          path: ${{ runner.temp }}/deploy-artifact

      - name: Verify the downloaded package
        if: steps.current.outputs.deploy == 'true'
        shell: bash
        env:
          EXPECTED_PACKAGE_SHA256: ${{ needs.verify.outputs.package_sha256 }}
        run: |
          set -euo pipefail

          artifact_dir="${RUNNER_TEMP}/deploy-artifact"
          cd "$artifact_dir"

          sha256sum --check SHA256SUMS

          actual="$(sha256sum site.tar.gz | awk '{ print $1 }')"
          if [[ "$actual" != "$EXPECTED_PACKAGE_SHA256" ]]; then
            echo "The package hash does not match the hash Verify recorded." >&2
            exit 1
          fi

          tar --list --gzip --file site.tar.gz > /dev/null
          tar --extract --to-stdout --gzip --file site.tar.gz ./index.html \
            > expected-index.html

      - name: Send the package to the production receiver
        if: steps.current.outputs.deploy == 'true'
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          DEPLOY_SSH_KNOWN_HOSTS: ${{ secrets.DEPLOY_SSH_KNOWN_HOSTS }}
          EXPECTED_PACKAGE_SHA256: ${{ needs.verify.outputs.package_sha256 }}
          EXPECTED_RECEIVER_SHA256: ${{ needs.verify.outputs.receiver_sha256 }}
        run: |
          set -euo pipefail

          : "${DEPLOY_HOST:?DEPLOY_HOST is missing}"
          : "${DEPLOY_USER:?DEPLOY_USER is missing}"
          : "${DEPLOY_PORT:?DEPLOY_PORT is missing}"
          : "${DEPLOY_SSH_PRIVATE_KEY:?DEPLOY_SSH_PRIVATE_KEY is missing}"
          : "${DEPLOY_SSH_KNOWN_HOSTS:?DEPLOY_SSH_KNOWN_HOSTS is missing}"
          : "${EXPECTED_PACKAGE_SHA256:?the package hash is missing}"
          : "${EXPECTED_RECEIVER_SHA256:?the receiver hash is missing}"

          [[ "$DEPLOY_HOST" =~ ^[A-Za-z0-9][A-Za-z0-9.-]*$ ]]
          [[ "$DEPLOY_USER" =~ ^[A-Za-z_][A-Za-z0-9_-]*$ ]]
          [[ "$DEPLOY_PORT" =~ ^[0-9]{1,5}$ ]]
          port_number=$((10#$DEPLOY_PORT))
          ((port_number >= 1 && port_number <= 65535))

          key_file="${RUNNER_TEMP}/production_deploy_key"
          known_hosts_file="${RUNNER_TEMP}/production_known_hosts"

          cleanup() {
            rm -f "$key_file" "$known_hosts_file"
          }
          trap cleanup EXIT

          umask 077
          printf '%s\n' "$DEPLOY_SSH_PRIVATE_KEY" | tr -d '\r' > "$key_file"
          printf '%s\n' "$DEPLOY_SSH_KNOWN_HOSTS" | tr -d '\r' > "$known_hosts_file"
          chmod 0600 "$key_file" "$known_hosts_file"
          ssh-keygen -y -P "" -f "$key_file" > /dev/null

          lookup="$DEPLOY_HOST"
          if [[ "$DEPLOY_PORT" != "22" ]]; then
            lookup="[$DEPLOY_HOST]:$DEPLOY_PORT"
          fi
          ssh-keygen -F "$lookup" -f "$known_hosts_file" > /dev/null

          artifact="${RUNNER_TEMP}/deploy-artifact/site.tar.gz"

          ssh_options=(
            -F /dev/null
            -T
            -i "$key_file"
            -p "$DEPLOY_PORT"
            -o BatchMode=yes
            -o IdentitiesOnly=yes
            -o PasswordAuthentication=no
            -o KbdInteractiveAuthentication=no
            -o StrictHostKeyChecking=yes
            -o "UserKnownHostsFile=$known_hosts_file"
            -o GlobalKnownHostsFile=/dev/null
            -o HostKeyAlgorithms=ssh-ed25519
            -o ClearAllForwardings=yes
            -o ForwardAgent=no
            -o ConnectTimeout=15
            -o ServerAliveInterval=15
            -o ServerAliveCountMax=2
            -o LogLevel=ERROR
          )

          installed="$(
            ssh "${ssh_options[@]}" "$DEPLOY_USER@$DEPLOY_HOST" version < /dev/null
          )"
          if [[ "$installed" != "RECEIVER $EXPECTED_RECEIVER_SHA256" ]]; then
            echo "The receiver on the host is not the reviewed scripts/deploy-receiver.py." >&2
            echo "Install the current file on the host, then run this workflow again." >&2
            exit 1
          fi

          result="$(
            ssh "${ssh_options[@]}" "$DEPLOY_USER@$DEPLOY_HOST" deploy < "$artifact"
          )"
          if [[ "$result" != "DEPLOY_OK $EXPECTED_PACKAGE_SHA256 $EXPECTED_RECEIVER_SHA256" ]]; then
            echo "The receiver did not confirm the expected package." >&2
            exit 1
          fi

          echo "Deployed package $EXPECTED_PACKAGE_SHA256"
          echo "Receiver $EXPECTED_RECEIVER_SHA256"

      - name: Install Node.js for the live gate
        if: steps.current.outputs.deploy == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.15.0

      - name: Verify production
        if: steps.current.outputs.deploy == 'true'
        shell: bash
        env:
          ORIGIN: https://cristianvega.ai
        run: |
          set -euo pipefail

          artifact_dir="${RUNNER_TEMP}/deploy-artifact"

          node "$artifact_dir/verify-deploy.mjs"

          curl \
            --fail \
            --silent \
            --show-error \
            --proto '=https' \
            --tlsv1.2 \
            --max-time 30 \
            --header 'Accept-Encoding: identity' \
            --header 'Cache-Control: no-cache' \
            "$ORIGIN/" \
            --output "${RUNNER_TEMP}/live-index.html"

          cmp "$artifact_dir/expected-index.html" "${RUNNER_TEMP}/live-index.html"
          echo "The live homepage matches the deployed package."

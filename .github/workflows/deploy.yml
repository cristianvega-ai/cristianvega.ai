# Verify each change. Deploy the verified main build to Cloudflare.
# Production secrets are available only in the deploy job.
# The first deploy uses workers.dev. README.md describes the domain switch.

name: Verify and deploy

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    outputs:
      package_sha256: ${{ steps.package.outputs.package_sha256 }}
      manifest_sha256: ${{ steps.package.outputs.manifest_sha256 }}

    steps:
      - name: Check out the commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.15.0

      - name: Install locked dependencies
        run: npm ci

      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: Verify package signatures
        run: npm audit signatures

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run the complete gate
        run: npm run verify

      - name: Package the site
        id: package
        shell: bash
        run: |
          set -euo pipefail

          for name in _headers _redirects index.html 404.html robots.txt sitemap-index.xml; do
            if [[ ! -f "dist/$name" ]]; then
              echo "dist/$name is missing" >&2
              exit 1
            fi
          done

          unexpected="$(find dist ! -type d ! -type f -print -quit)"
          if [[ -n "$unexpected" ]]; then
            echo "dist/ holds an object that is not a file or a directory: $unexpected" >&2
            exit 1
          fi

          package_dir="${RUNNER_TEMP}/deploy-package"
          install -d -m 0700 "$package_dir"

          tar \
            --create \
            --gzip \
            --format=ustar \
            --owner=0 \
            --group=0 \
            --numeric-owner \
            --file "$package_dir/site.tar.gz" \
            --directory dist \
            .

          cp scripts/verify-deploy.mjs wrangler.jsonc package.json package-lock.json "$package_dir/"
          (
            cd "$package_dir"
            sha256sum site.tar.gz verify-deploy.mjs wrangler.jsonc package.json package-lock.json > SHA256SUMS
          )

          package_sha256="$(sha256sum "$package_dir/site.tar.gz" | awk '{ print $1 }')"
          manifest_sha256="$(sha256sum "$package_dir/SHA256SUMS" | awk '{ print $1 }')"
          echo "package_sha256=$package_sha256" >> "$GITHUB_OUTPUT"
          echo "manifest_sha256=$manifest_sha256" >> "$GITHUB_OUTPUT"
          echo "package sha256:  $package_sha256"
          echo "manifest sha256: $manifest_sha256"

      - name: Store the verified package
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: production-site-${{ github.sha }}
          path: ${{ runner.temp }}/deploy-package
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  deploy:
    name: Deploy production
    needs: verify
    if: >-
      needs.verify.result == 'success' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      github.ref == 'refs/heads/main' &&
      github.repository == 'cristianvega-ai/cristianvega.ai' &&
      vars.PRODUCTION_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    environment:
      name: production
      url: ${{ steps.publish.outputs.origin }}

    concurrency:
      group: cristianvega-ai-production
      cancel-in-progress: false

    steps:
      - name: Confirm this is the current main commit
        id: current
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          current_sha="$(
            git ls-remote \
              https://github.com/cristianvega-ai/cristianvega.ai.git \
              refs/heads/main |
            awk 'NR == 1 { print $1 }'
          )"

          if [[ ! "$current_sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "GitHub did not return a valid main commit." >&2
            exit 1
          fi

          if [[ "$current_sha" == "$EXPECTED_SHA" ]]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            echo "A newer main commit exists. This run will not deploy; the newer run will."
          fi

      - name: Download the verified package
        if: steps.current.outputs.deploy == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: production-site-${{ github.sha }}
          path: ${{ runner.temp }}/deploy-artifact

      - name: Verify the downloaded package
        if: steps.current.outputs.deploy == 'true'
        shell: bash
        env:
          EXPECTED_PACKAGE_SHA256: ${{ needs.verify.outputs.package_sha256 }}
          EXPECTED_MANIFEST_SHA256: ${{ needs.verify.outputs.manifest_sha256 }}
        run: |
          set -euo pipefail

          artifact_dir="${RUNNER_TEMP}/deploy-artifact"
          cd "$artifact_dir"

          manifest="$(sha256sum SHA256SUMS | awk '{ print $1 }')"
          if [[ "$manifest" != "$EXPECTED_MANIFEST_SHA256" ]]; then
            echo "The manifest does not match the hash Verify recorded." >&2
            exit 1
          fi
          sha256sum --check SHA256SUMS

          actual="$(sha256sum site.tar.gz | awk '{ print $1 }')"
          if [[ "$actual" != "$EXPECTED_PACKAGE_SHA256" ]]; then
            echo "The package hash does not match the hash Verify recorded." >&2
            exit 1
          fi

          mkdir dist
          tar --extract --gzip --file site.tar.gz --directory dist

      - name: Install Node.js for deployment
        if: steps.current.outputs.deploy == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.15.0

      - name: Install locked deployment tooling
        if: steps.current.outputs.deploy == 'true'
        working-directory: ${{ runner.temp }}/deploy-artifact
        run: npm ci --ignore-scripts

      - name: Publish the verified build to Cloudflare
        id: publish
        if: steps.current.outputs.deploy == 'true'
        working-directory: ${{ runner.temp }}/deploy-artifact
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: 'false'
          WRANGLER_OUTPUT_FILE_PATH: ${{ runner.temp }}/wrangler-deploy.jsonl
        run: |
          set -euo pipefail
          : "${CLOUDFLARE_API_TOKEN:?CLOUDFLARE_API_TOKEN is missing}"
          : "${CLOUDFLARE_ACCOUNT_ID:?CLOUDFLARE_ACCOUNT_ID is missing}"
          npx --no-install wrangler deploy --config wrangler.jsonc --no-autoconfig --env "" --message "$GITHUB_SHA"
          node --input-type=module <<'NODE'
          import { appendFileSync, readFileSync } from "node:fs";
          const records = readFileSync(process.env.WRANGLER_OUTPUT_FILE_PATH, "utf8")
            .trim().split("\n").map((line) => JSON.parse(line));
          const deployment = records.findLast((record) => record.type === "deploy");
          const origin = deployment?.targets?.find((target) =>
            /^https:\/\/cristianvega-ai\.[a-z0-9-]+\.workers\.dev$/.test(target));
          if (!origin) throw new Error("Wrangler did not report the expected workers.dev address");
          appendFileSync(process.env.GITHUB_OUTPUT, `origin=${origin}\n`);
          appendFileSync(process.env.GITHUB_STEP_SUMMARY,
            `Cloudflare build: ${origin}\n\nCommit: ${process.env.GITHUB_SHA}\n`);
          NODE

      - name: Verify the Cloudflare deployment
        if: steps.current.outputs.deploy == 'true'
        working-directory: ${{ runner.temp }}/deploy-artifact
        shell: bash
        env:
          ORIGIN: ${{ steps.publish.outputs.origin }}
          EXPECTED_INDEX: dist/index.html
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if node verify-deploy.mjs; then
              exit 0
            fi
            if [[ "$attempt" -lt 3 ]]; then
              sleep 10
            fi
          done
          exit 1

      - name: Verify the production domain after cutover
        if: steps.current.outputs.deploy == 'true' && vars.CLOUDFLARE_PRODUCTION_READY == 'true'
        working-directory: ${{ runner.temp }}/deploy-artifact
        env:
          ORIGIN: https://cristianvega.ai
          EXPECTED_INDEX: dist/index.html
          CHECK_CANONICAL_REDIRECTS: 'true'
        run: node verify-deploy.mjs

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
<title>Aetherhold — The Skyward Keep</title>
<meta name="description" content="A fully procedural voxel citadel floating above the clouds, rendered in real time with WebGL shaders." />
<link rel="stylesheet" href="style.css" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230d1a20'/%3E%3Cpath d='M16 5l4 7v3h-8v-3zM10 16h12v6l4 4H6l4-4z' fill='%23d9b26a'/%3E%3C/svg%3E" />
</head>
<body>
<canvas id="scene"></canvas>

<div id="ui">
  <header class="masthead">
    <div class="kicker"><span class="rule"></span>A procedural voxel realm</div>
    <h1>Aetherhold</h1>
    <p class="sub">The keep above the clouds</p>
  </header>

  <div class="badge">
    <span class="dot"></span>
    <span>Real-time &middot; WebGL&nbsp;2</span>
  </div>

  <footer>
    <div class="stats">
      <div class="stat"><span id="voxels">&mdash;</span><label>voxels</label></div>
      <div class="stat"><span id="fps">60</span><label>fps</label></div>
      <div class="stat"><span>100%</span><label>procedural</label></div>
    </div>
    <div class="hints">
      <span>drag to orbit</span><i>&middot;</i><span>scroll to zoom</span>
    </div>
  </footer>

  <div class="controls">
    <button id="capture" class="pill" type="button" title="Save a still (C)">
      <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2 4.5h2.2L5.4 3h5.2l1.2 1.5H14v8H2z" fill="none" stroke="currentColor" stroke-width="1"/><circle cx="8" cy="8.3" r="2.5" fill="none" stroke="currentColor" stroke-width="1"/></svg>
      Capture
    </button>
    <button id="auto-orbit" class="pill on" type="button" title="Toggle auto orbit (Space)">
      <span class="ring"></span>Auto orbit
    </button>
  </div>
</div>

<div id="loader">
  <div class="loader-inner">
    <div class="mark">&#10022;</div>
    <div class="load-title">Aetherhold</div>
    <div class="load-sub">raising the citadel</div>
    <div class="bar"><i></i></div>
  </div>
</div>

<script>
window.addEventListener('error', function () {
  var l = document.getElementById('loader');
  if (l && !l.classList.contains('done')) {
    var sub = l.querySelector('.load-sub');
    if (sub) sub.textContent = 'WebGL 2 is required to enter Aetherhold';
  }
});
</script>
<script src="bundle.js"></script>
</body>
</html>
